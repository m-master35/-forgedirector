name: Benchmark API Contract

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/benchmark-api-contract.yml
      - tests/run-live-api-contract.py

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ForgeDirectorApiContractBenchmark
          mask-aws-account-id: true
      - name: Resolve live API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks             --stack-name forgedirector-commercial             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='CommercialApiBaseUrl'].OutputValue"             --output text)
          echo "url=${API_URL%/}" >> "$GITHUB_OUTPUT"
      - name: Run malformed-request contract benchmark
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: python tests/run-live-api-contract.py
      - name: Add summary
        if: always()
        run: |
          if [ -f /tmp/api-contract-summary.md ]; then
            cat /tmp/api-contract-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
