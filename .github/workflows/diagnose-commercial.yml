name: Diagnose Commercial Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-commercial.yml

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ForgeDirectorDiagnostics
          mask-aws-account-id: true
      - name: Resolve function and show recent errors
        run: |
          set -euo pipefail
          FUNCTION=$(aws cloudformation describe-stack-resources             --stack-name forgedirector-commercial             --region "$AWS_REGION"             --query "StackResources[?LogicalResourceId=='CreativeIntelligenceFunction'].PhysicalResourceId"             --output text)
          echo "Function: $FUNCTION"
          aws logs tail "/aws/lambda/$FUNCTION"             --region "$AWS_REGION"             --since 10m             --format short             --filter-pattern '"ForgeDirector commercial API error"' || true
