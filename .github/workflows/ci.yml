name: Validate ForgeDirector

on:
  push:
    branches:
      - main
      - commercial-api-v1
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check cloud.js

      - name: Check backend JavaScript syntax
        run: |
          node --check backend/index.mjs
          node --check backend/director-prompt.mjs
          node --check backend/commercial.mjs
          node --check backend/qa.mjs

      - name: Run commercial QA tests
        run: node tests/commercial-qa.mjs

      - name: Check required project files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f config.js
          test -f cloud.js
          test -f README.md
          test -f LICENSE
          test -f template.yaml
          test -f commercial-template.yaml
          test -f backend/package.json
          test -f backend/index.mjs
          test -f backend/director-prompt.mjs
          test -f backend/commercial.mjs
          test -f backend/qa.mjs
          test -f docs/friction-log.md
          test -f commercial/openapi.yaml
          test -f commercial/pricing.md
          test -f commercial/listing.md

      - name: Sanity-check OpenAPI routes
        run: |
          grep -q '^  /v1/plan:' commercial/openapi.yaml
          grep -q '^  /v1/revise:' commercial/openapi.yaml
          grep -q '^  /v1/qa:' commercial/openapi.yaml
          grep -q '^  /health:' commercial/openapi.yaml

      - name: Parse HTML
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          parser = HTMLParser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          print('HTML parse passed')
          PY
