AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ForgeDirector Video Creative Intelligence commercial API

Parameters:
  BedrockModelId:
    Type: String
    Default: eu.amazon.nova-2-lite-v1:0
    Description: Primary Amazon Bedrock model ID or inference profile ARN
  VideoFallbackModelId:
    Type: String
    Default: eu.amazon.nova-pro-v1:0
    Description: Fallback Amazon Bedrock model used only when the primary video analysis is empty or non-substantive
  RapidApiProxySecret:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional X-RapidAPI-Proxy-Secret value from RapidAPI Studio
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS origin. RapidAPI server-to-server calls do not require browser CORS.
  MaxVideoBytes:
    Type: Number
    Default: 31457280
    Description: Maximum uploaded video size accepted for analysis (30 MiB)
  VideoAssetBucketName:
    Type: String
    Description: Existing private S3 bucket used for temporary ForgeDirector video assets

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 120
    MemorySize: 1024
    Tracing: Active

Resources:
  CreativeIntelligenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: commercial.handler
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          VIDEO_FALLBACK_MODEL_ID: !Ref VideoFallbackModelId
          RAPIDAPI_PROXY_SECRET: !Ref RapidApiProxySecret
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          MAX_BODY_BYTES: '120000'
          MAX_VIDEO_BYTES: !Ref MaxVideoBytes
          UPLOAD_URL_TTL_SECONDS: '900'
          VIDEO_BUCKET: !Ref VideoAssetBucketName
          VIDEO_PREFIX: video-assets
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${VideoAssetBucketName}/video-assets/*'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - GET
            - POST
          AllowHeaders:
            - content-type
            - authorization
            - cache-control
            - expires
            - pragma
            - usequerystring
            - x-rapidapi-ua
            - x-rapidapi-key
            - x-rapidapi-host
            - x-rapidapi-proxy-secret
            - x-rapidapi-user
            - x-rapidapi-subscription
            - x-rapidapi-version
            - x-forwarded-for
            - x-forwarded-host

Outputs:
  CommercialApiBaseUrl:
    Description: Base URL to configure in RapidAPI Studio
    Value: !GetAtt CreativeIntelligenceFunctionUrl.FunctionUrl
  VideoAssetBucketName:
    Description: Existing private bucket used for temporary ForgeDirector video-analysis uploads
    Value: !Ref VideoAssetBucketName
