openapi: 3.0.3
info:
  title: ForgeDirector Video Creative Intelligence API
  version: 1.1.0
  description: |
    Analyze short-form video for hook strength, pacing, continuity, CTA clarity, platform fit, retention risks, and actionable fixes. ForgeDirector also creates structured video-production manifests, applies controlled revisions, and runs deterministic production QA.
  contact:
    name: ForgeDirector
paths:
  /health:
    get:
      operationId: health
      summary: Check API health and discover endpoints
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/uploads:
    post:
      operationId: createVideoUpload
      summary: Create a temporary private upload URL for a video
      description: |
        Returns a short-lived presigned S3 PUT URL. Upload the video directly to that URL using the returned Content-Type header, then pass the returned assetId to /v1/analyze. Successfully analyzed assets are deleted immediately; abandoned uploads remain private and are removed by the storage lifecycle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
            example:
              contentType: video/mp4
              sizeBytes: 8421300
      responses:
        '200':
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/EngineError'

  /v1/analyze:
    post:
      operationId: analyzeVideo
      summary: Analyze a short-form video and return structured creative intelligence
      description: |
        Uses Amazon Nova multimodal video understanding to inspect the uploaded video and return standardized creative scores, first-three-second hook analysis, scene/timeline issues, retention risks, continuity and CTA assessment, ranked fixes, regeneration prompts, and repurposing guidance. Scores are heuristic creative-quality assessments rather than predictions of views, retention, sales, ROAS, or virality.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
            example:
              assetId: 8f0f6a79-14c8-4cc9-9bde-272d25dd7070
              platform: TikTok
              objective: conversion
              audience: Young professionals
              durationSeconds: 30
              context: Premium productivity app. Keep recommendations credible and direct.
              requirements:
                mustShow: [Brand logo, App interface]
                mustNotShow: [Competitor logos]
                mustIncludeText: [Start free]
                continuityRules: [Use the same lead character throughout]
                ctaRequired: true
      responses:
        '200':
          description: Structured video analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Uploaded asset was not found or is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Uploaded video exceeds the configured analysis limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          $ref: '#/components/responses/EngineError'

  /v1/plan:
    post:
      operationId: planCampaign
      summary: Turn a creative brief into a production manifest
      description: Creates a new structured short-form video campaign from a natural-language brief.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
            examples:
              supplementAd:
                value:
                  brief: Create a premium 30-second vertical ad for a magnesium supplement aimed at young professionals. Keep the language credible and restrained.
                  constraints:
                    platform: TikTok
                    aspectRatio: 9:16
                    durationSeconds: 30
      responses:
        '200':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/EngineError'

  /v1/revise:
    post:
      operationId: reviseCampaign
      summary: Revise part of an existing campaign while preserving the rest
      description: Applies a natural-language revision to an existing production manifest and returns the complete updated manifest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseRequest'
      responses:
        '200':
          description: Campaign revised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/EngineError'

  /v1/qa:
    post:
      operationId: checkCampaign
      summary: Run production QA on a campaign manifest
      description: Checks duration integrity, scene structure, voiceover density, continuity lock, aspect ratio, and prompt completeness without consuming an AI-model call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign]
              properties:
                campaign:
                  $ref: '#/components/schemas/Campaign'
      responses:
        '200':
          description: QA result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Request did not arrive through the configured RapidAPI gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EngineError:
      description: Creative intelligence engine could not complete the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UploadRequest:
      type: object
      required: [contentType]
      properties:
        contentType:
          type: string
          enum: [video/mp4, video/quicktime, video/x-matroska, video/webm]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 31457280
          description: Optional declared file size. The uploaded object is verified again before analysis.

    UploadResponse:
      type: object
      required: [upload, next, requestId]
      properties:
        upload:
          type: object
          required: [assetId, uploadUrl, method, headers, expiresInSeconds, maxBytes, format]
          properties:
            assetId:
              type: string
              format: uuid
            uploadUrl:
              type: string
              format: uri
            method:
              type: string
              enum: [PUT]
            headers:
              type: object
              additionalProperties:
                type: string
            expiresInSeconds:
              type: integer
            maxBytes:
              type: integer
            format:
              type: string
        next:
          type: object
          additionalProperties: true
        requestId:
          type: string

    AnalyzeRequest:
      type: object
      required: [assetId]
      properties:
        assetId:
          type: string
          format: uuid
          description: assetId returned by POST /v1/uploads after the video has been uploaded.
        platform:
          type: string
          enum: [TikTok, Instagram Reels, YouTube Shorts, General]
          default: General
        objective:
          type: string
          enum: [engagement, conversion, awareness, education, app-install, lead-generation]
          default: engagement
        audience:
          type: string
          maxLength: 1000
        durationSeconds:
          type: number
          minimum: 1
          maximum: 120
        context:
          type: string
          maxLength: 3000
          description: Optional brand, product, campaign, or creative context.
        transcript:
          type: string
          maxLength: 12000
          description: Optional supplied transcript. Use this when exact spoken-word analysis is important.
        requirements:
          type: object
          description: Optional explicit production rules to verify against the video.
          properties:
            mustShow:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 300
            mustNotShow:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 300
            mustIncludeText:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 300
            continuityRules:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 300
            ctaRequired:
              type: boolean

    AnalyzeResponse:
      type: object
      required: [analysis, meta]
      properties:
        analysis:
          $ref: '#/components/schemas/VideoAnalysis'
        meta:
          type: object
          additionalProperties: true

    VideoAnalysis:
      type: object
      required: [analysisVersion, scoringVersion, scoring, summary, scores, compliance, qualityGate, timeline, fixes, regenerationPrompts]
      properties:
        analysisVersion:
          type: string
        scoringVersion:
          type: string
        scoring:
          type: object
          required: [objective, weights]
          properties:
            objective:
              type: string
            weights:
              type: object
              additionalProperties:
                type: number
        summary:
          type: string
        creativeAngle:
          type: string
        scores:
          type: object
          required: [overall, hook, pacing, clarity, visualQuality, continuity, cta, platformFit, conversionReadiness]
          properties:
            overall:
              type: integer
              minimum: 0
              maximum: 100
            hook:
              type: integer
              minimum: 0
              maximum: 100
            pacing:
              type: integer
              minimum: 0
              maximum: 100
            clarity:
              type: integer
              minimum: 0
              maximum: 100
            visualQuality:
              type: integer
              minimum: 0
              maximum: 100
            continuity:
              type: integer
              minimum: 0
              maximum: 100
            cta:
              type: integer
              minimum: 0
              maximum: 100
            platformFit:
              type: integer
              minimum: 0
              maximum: 100
            conversionReadiness:
              type: integer
              minimum: 0
              maximum: 100
        compliance:
          type: object
          required: [status, passed, failedCount, uncertainCount, checks]
          properties:
            status:
              type: string
              enum: [not_requested, pass, fail, needs_review]
            passed:
              type: boolean
              nullable: true
            failedCount:
              type: integer
              minimum: 0
            uncertainCount:
              type: integer
              minimum: 0
            checks:
              type: array
              items:
                type: object
                required: [type, rule, status, evidence, timestampSeconds]
                properties:
                  type:
                    type: string
                  rule:
                    type: string
                  status:
                    type: string
                    enum: [pass, fail, uncertain]
                  evidence:
                    type: string
                  timestampSeconds:
                    type: number
                    nullable: true
        qualityGate:
          type: object
          required: [action, confidence, blockers, reasons, thresholds]
          properties:
            action:
              type: string
              enum: [accept, revise, regenerate]
            confidence:
              type: string
              enum: [high, medium, low]
            blockers:
              type: array
              items:
                type: string
            reasons:
              type: array
              items:
                type: string
            thresholds:
              type: object
              additionalProperties:
                type: number
        hook:
          type: object
          additionalProperties: true
        timeline:
          type: array
          items:
            type: object
            additionalProperties: true
        retentionRisks:
          type: array
          items:
            type: object
            additionalProperties: true
        continuity:
          type: object
          additionalProperties: true
        cta:
          type: object
          additionalProperties: true
        platformAssessment:
          type: object
          additionalProperties: true
        fixes:
          type: array
          items:
            type: object
            additionalProperties: true
        regenerationPrompts:
          type: array
          items:
            type: object
            additionalProperties: true
        repurpose:
          type: object
          additionalProperties: true
        limitations:
          type: array
          items:
            type: string

    PlanRequest:
      type: object
      required: [brief]
      properties:
        brief:
          type: string
          maxLength: 6000
          description: Natural-language creative brief.
        constraints:
          type: object
          additionalProperties: true
          description: Optional structured creative constraints such as platform, durationSeconds, aspectRatio, audience, tone, or product rules.

    ReviseRequest:
      type: object
      required: [instruction, campaign]
      properties:
        instruction:
          type: string
          maxLength: 6000
          description: What should change in the existing campaign.
        campaign:
          $ref: '#/components/schemas/Campaign'

    CampaignResponse:
      type: object
      required: [campaign, qa, meta]
      properties:
        campaign:
          $ref: '#/components/schemas/Campaign'
        qa:
          $ref: '#/components/schemas/QAResult'
        meta:
          type: object
          properties:
            operation:
              type: string
            modelId:
              type: string
            usage:
              type: object
              nullable: true
              additionalProperties: true
            requestId:
              type: string

    Campaign:
      type: object
      required: [summary, audience, platform, aspectRatio, durationSeconds, continuity, scenes, changeSummary]
      properties:
        summary:
          type: string
        audience:
          type: string
        platform:
          type: string
          enum: [TikTok, Instagram Reels, YouTube Shorts, General]
        aspectRatio:
          type: string
          enum: ['9:16', '1:1', '16:9']
        durationSeconds:
          type: integer
          minimum: 1
          maximum: 120
        continuity:
          type: object
          required: [leadCharacter, locked]
          properties:
            leadCharacter:
              type: string
              nullable: true
            locked:
              type: boolean
        scenes:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/Scene'
        changeSummary:
          type: string

    Scene:
      type: object
      required: [id, durationSeconds, visualDirection, voiceover, generationPrompt]
      properties:
        id:
          type: integer
          minimum: 1
        durationSeconds:
          type: integer
          minimum: 1
        visualDirection:
          type: string
        voiceover:
          type: string
        generationPrompt:
          type: string

    QAResponse:
      type: object
      properties:
        qa:
          $ref: '#/components/schemas/QAResult'
        requestId:
          type: string

    QAResult:
      type: object
      required: [score, passed, checks, issues]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        passed:
          type: boolean
        summary:
          type: string
        checks:
          type: array
          items:
            type: object
            additionalProperties: true
        issues:
          type: array
          items:
            type: object
            additionalProperties: true

    HealthResponse:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        status:
          type: string
        endpoints:
          type: object
          additionalProperties:
            type: string
        limits:
          type: object
          additionalProperties: true
        requestId:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        requestId:
          type: string
