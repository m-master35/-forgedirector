name: Benchmark Unit Cost

# Long-video release economics probe.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark-cost-profile.yml
      - tests/run-live-cost-profile.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: forgedirector-cost-profile-v2
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ForgeDirectorCostProfile
          mask-aws-account-id: true
      - name: Resolve live API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks             --stack-name forgedirector-commercial             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='CommercialApiBaseUrl'].OutputValue"             --output text)
          echo "url=${API_URL%/}" >> "$GITHUB_OUTPUT"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run live unit-cost profile
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: python tests/run-live-cost-profile.py
      - name: Add cost summary
        if: always()
        run: |
          if [ -f /tmp/cost-profile-summary.md ]; then
            cat /tmp/cost-profile-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgedirector-cost-profile
          path: |
            /tmp/cost-profile-summary.md
            /tmp/cost-profile.json
          if-no-files-found: warn
