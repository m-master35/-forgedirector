name: Deploy Commercial API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-commercial.yml
      - backend/commercial.mjs
      - backend/director-prompt.mjs
      - backend/qa.mjs
      - backend/storage.mjs
      - backend/video-intelligence.mjs
      - backend/package.json
      - commercial-template.yaml

permissions:
  contents: read
  id-token: write

concurrency:
  group: forgedirector-commercial-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_SAM_ARTIFACT_BUCKET: ${{ vars.AWS_SAM_ARTIFACT_BUCKET }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}

jobs:
  deploy:
    if: ${{ vars.AWS_SAM_ARTIFACT_BUCKET != '' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ForgeDirectorCommercialDeploy
          mask-aws-account-id: true

      - name: Build commercial API
        run: sam build --template-file commercial-template.yaml

      - name: Package commercial API
        run: |
          sam package \
            --template-file .aws-sam/build/template.yaml \
            --s3-bucket "$AWS_SAM_ARTIFACT_BUCKET" \
            --output-template-file .aws-sam/packaged.yaml

      - name: Deploy commercial API
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EXECUTION_ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/ForgeDirectorCloudFormationExecutionRole"
          PARAMETERS=("VideoAssetBucketName=${AWS_SAM_ARTIFACT_BUCKET}")
          if [ -n "${RAPIDAPI_PROXY_SECRET:-}" ]; then
            PARAMETERS+=("RapidApiProxySecret=${RAPIDAPI_PROXY_SECRET}")
          fi
          sam deploy \
            --template-file .aws-sam/packaged.yaml \
            --stack-name forgedirector-commercial \
            --region "$AWS_REGION" \
            --role-arn "$EXECUTION_ROLE_ARN" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides "${PARAMETERS[@]}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Resolve API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name forgedirector-commercial \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CommercialApiBaseUrl'].OutputValue" \
            --output text)
          API_URL="${API_URL%/}"
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "### ForgeDirector commercial API" >> "$GITHUB_STEP_SUMMARY"
          echo "$API_URL/" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test health endpoint and CORS
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            -H 'Origin: https://rapidapi.com' \
            "$API_URL/health")
          cat /tmp/health.json
          test "$STATUS" = "200"
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"analyze":"POST /v1/analyze"' /tmp/health.json

          curl -sS -D /tmp/cors.headers -o /dev/null \
            -X OPTIONS \
            -H 'Origin: https://rapidapi.com' \
            -H 'Access-Control-Request-Method: GET' \
            "$API_URL/health"
          grep -qi '^access-control-allow-origin: https://rapidapi.com' /tmp/cors.headers
          grep -qi '^access-control-allow-methods: .*GET' /tmp/cors.headers

      - name: Smoke test gateway lock and Bedrock plan endpoint
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          set -euo pipefail
          PAYLOAD='{"brief":"Create a concise 10-second vertical social ad for a fictional productivity drink aimed at young professionals."}'

          DIRECT_STATUS=$(curl -sS -o /tmp/direct-plan.json -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            --data "$PAYLOAD" \
            "$API_URL/v1/plan")

          if [ -n "${RAPIDAPI_PROXY_SECRET:-}" ]; then
            test "$DIRECT_STATUS" = "401"
            grep -q 'Unauthorized gateway request' /tmp/direct-plan.json
            AUTH_STATUS=$(curl -sS -o /tmp/plan.json -w '%{http_code}' \
              -X POST \
              -H 'content-type: application/json' \
              -H "x-rapidapi-proxy-secret: $RAPIDAPI_PROXY_SECRET" \
              --data "$PAYLOAD" \
              "$API_URL/v1/plan")
          else
            AUTH_STATUS="$DIRECT_STATUS"
            cp /tmp/direct-plan.json /tmp/plan.json
          fi

          test "$AUTH_STATUS" = "200"
          grep -q '"campaign"' /tmp/plan.json
          grep -q '"operation":"plan"' /tmp/plan.json

      - name: Smoke test real video intelligence path
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          set -euo pipefail
          HEADERS=(-H 'content-type: application/json')
          if [ -n "${RAPIDAPI_PROXY_SECRET:-}" ]; then
            HEADERS+=(-H "x-rapidapi-proxy-secret: $RAPIDAPI_PROXY_SECRET")
          fi

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -f lavfi -i "testsrc=size=320x568:rate=8" -t 3 -pix_fmt yuv420p -an -y /tmp/test.mp4 >/dev/null 2>&1
          SIZE=$(stat -c%s /tmp/test.mp4)

          STATUS=$(curl -sS -o /tmp/upload.json -w '%{http_code}' \
            -X POST \
            "${HEADERS[@]}" \
            --data "{\"contentType\":\"video/mp4\",\"sizeBytes\":$SIZE}" \
            "$API_URL/v1/uploads")
          test "$STATUS" = "200"

          UPLOAD_URL=$(jq -r '.upload.uploadUrl' /tmp/upload.json)
          ASSET_ID=$(jq -r '.upload.assetId' /tmp/upload.json)
          test -n "$UPLOAD_URL"
          test -n "$ASSET_ID"

          curl -sS -X PUT \
            -H 'content-type: video/mp4' \
            --upload-file /tmp/test.mp4 \
            "$UPLOAD_URL" >/dev/null

          ANALYZE_STATUS=$(curl -sS -o /tmp/analyze.json -w '%{http_code}' \
            -X POST \
            "${HEADERS[@]}" \
            --data "{\"assetId\":\"$ASSET_ID\",\"platform\":\"TikTok\",\"objective\":\"engagement\",\"durationSeconds\":3,\"context\":\"Automated synthetic CI test clip.\",\"requirements\":{\"mustShow\":[\"Brand logo\"],\"ctaRequired\":true}}" \
            "$API_URL/v1/analyze")
          cat /tmp/analyze.json
          test "$ANALYZE_STATUS" = "200"
          jq -e '.analysis.scores.overall >= 0 and .analysis.scores.overall <= 100' /tmp/analyze.json >/dev/null
          jq -e '.analysis.qualityGate.action == "accept" or .analysis.qualityGate.action == "revise" or .analysis.qualityGate.action == "regenerate"' /tmp/analyze.json >/dev/null
          jq -e '.analysis.compliance.status != "not_requested"' /tmp/analyze.json >/dev/null
          jq -e '.analysis.compliance.checks | length == 2' /tmp/analyze.json >/dev/null
          jq -e '.meta.operation == "analyze"' /tmp/analyze.json >/dev/null
