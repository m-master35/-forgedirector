name: Benchmark Video QA Repeatability

# Stochastic release gate for repeated genuine generated-video analysis. Re-run after contiguous-window verifier hardening.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark-video-repeatability.yml
      - tests/run-live-video-repeatability.py

permissions:
  contents: read
  id-token: write

concurrency:
  group: forgedirector-video-repeatability
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  RAPIDAPI_PROXY_SECRET: ${{ secrets.RAPIDAPI_PROXY_SECRET }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ForgeDirectorVideoRepeatability
          mask-aws-account-id: true

      - name: Resolve live API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks             --stack-name forgedirector-commercial             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='CommercialApiBaseUrl'].OutputValue"             --output text)
          echo "url=${API_URL%/}" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Run repeated real-video QA benchmark
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: python tests/run-live-video-repeatability.py

      - name: Add summary
        if: always()
        run: |
          if [ -f /tmp/video-repeatability-summary.md ]; then
            cat /tmp/video-repeatability-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload repeatability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgedirector-video-repeatability
          path: |
            /tmp/video-repeatability-summary.md
            /tmp/video-repeatability-results.json
          if-no-files-found: warn
